<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Oak Tree &mdash; Draft</title>
<style>
:root{
  --bg:#0b0b14; --panel:#141423; --line:#2a2a4a; --text:#fff; --muted:#b9b9d6;
  --gold:#c9a94a; --accent:#ffd95e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:21px;margin:2px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.stage{position:relative;height:62vh;min-height:380px;background:
  radial-gradient(ellipse at 50% 38%,#1c1c34 0%,var(--bg) 62%);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block}
#status{margin:10px 2px 0;font-size:14px;color:var(--muted);min-height:20px}
#status.error{color:#ff8a8a}
.controls{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row label{font-size:14px;color:var(--muted);min-width:64px}
.slider-row output{font-size:14px;color:var(--accent);min-width:48px;text-align:right}
input[type=range]{flex:1;appearance:none;-webkit-appearance:none;height:6px;
  border-radius:3px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
  width:28px;height:28px;border-radius:50%;background:var(--gold);
  border:2px solid var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;
  background:var(--gold);border:2px solid var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.45}
button{
  appearance:none;-webkit-appearance:none;
  min-height:46px;padding:10px 16px;font-size:16px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  cursor:pointer;flex:1 1 auto;
}
button:active{transform:scale(.97)}
button.active{border-color:var(--gold);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--gold)}
button:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oak Tree &mdash; Draft</h1>
  <p class="sub">Oak tree, draft mesh. 14,998 triangles &middot; Wind sway in the canopy.</p>
  <div class="stage" id="stage"></div>
  <div id="status">Loading tree&hellip;</div>
  <div class="controls">
    <div class="slider-row">
      <label for="breeze-slider">Breeze</label>
      <input type="range" id="breeze-slider" min="0" max="2" step="0.1" value="1" disabled>
      <output id="breeze-value">1.0x</output>
    </div>
    <div class="row">
      <button type="button" id="sway-btn" class="active" disabled>Sway: On</button>
      <button type="button" id="wire-btn" disabled>Wireframe: Off</button>
    </div>
  </div>
  <p class="hint">Drag to spin &middot; pinch to zoom &middot; two fingers to move around. The breeze slider sets how hard the wind blows.</p>
</div>
